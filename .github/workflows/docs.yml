name: Docs

# Every PR and main push builds the MkDocs Material site to validate it;
# pushes to main additionally deploy the HTML to GitHub Pages. Docs track
# main (latest), independent of the tag-driven release.yml flow.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/dashscope_agenticx/**'
      - 'mkdocs.yml'
      - 'requirements-doc.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/dashscope_agenticx/**'
      - 'mkdocs.yml'
      - 'requirements-doc.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # mkdocstrings imports the real package, so install it alongside the
      # doc toolchain. Core dependencies suffice: every Reference target
      # guards optional imports (textual/playwright/etc.) lazily.
      - run: python -m pip install -r requirements-doc.txt .
      - name: Build HTML
        run: mkdocs build --strict
      - name: Upload site artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
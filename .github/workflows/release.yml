name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: sha256sum dist/* > dist/SHA256SUMS-python
      - uses: actions/upload-artifact@v4
        with:
          name: python-distribution
          path: dist/*

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            platform: macos-arm64
            executable: agenticx
          - os: macos-15-intel
            arch: x86_64
            platform: macos-x86_64
            executable: agenticx
          - os: ubuntu-latest
            arch: x86_64
            platform: linux-x86_64
            executable: agenticx
          - os: windows-latest
            arch: x86_64
            platform: windows-x86_64
            executable: agenticx.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux audio system library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2

      - name: Install dependencies
        run: pip install -e ".[build,all]"

      - name: Build binary
        run: |
          pyinstaller \
            --onefile \
            --name ${{ matrix.executable }} \
            --hidden-import dashscope_agenticx.tools.filesystem \
            --hidden-import dashscope_agenticx.tools.shell \
            --hidden-import dashscope_agenticx.providers.tongyi \
            --hidden-import dashscope_agenticx.providers.anthropic \
            --hidden-import dashscope_agenticx.providers.openai \
            --collect-all dashscope_agenticx \
            --collect-all dashscope \
            --clean \
            src/dashscope_agenticx/__main__.py
        shell: bash

      - name: Smoke test binary
        run: ./dist/${{ matrix.executable }} --version
        shell: bash

      - name: Package release asset
        run: |
          mkdir -p package/agenticx
          cp "dist/${{ matrix.executable }}" package/agenticx/
          tar -czf "dist/agenticx-${{ matrix.platform }}.tar.gz" \
            -C package agenticx
          python -c 'import hashlib; from pathlib import Path; asset = Path("dist/agenticx-${{ matrix.platform }}.tar.gz"); print(hashlib.sha256(asset.read_bytes()).hexdigest(), asset.name)' > "dist/SHA256SUMS-${{ matrix.platform }}"
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agenticx-${{ matrix.platform }}
          path: |
            dist/agenticx-${{ matrix.platform }}.tar.gz
            dist/SHA256SUMS-${{ matrix.platform }}

  release:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true

site_name: DashScope AgenticX
site_description: DashScope AgenticX documentation — agentic runtime CLI, embeddable Python SDK, and API reference
site_url: https://dashscope.github.io/dashscope-agenticx/
repo_url: https://github.com/dashscope/dashscope-agenticx
repo_name: dashscope/dashscope-agenticx

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  # System font stack: the Google Fonts stylesheet is render-blocking and
  # unreachable for mainland-China readers, stalling first paint.
  font: false
  # DashScope mark shared with dashscope-sdk-python's docs (potrace
  # vectorization of logo.png with the white background dropped).
  logo: assets/logo.svg
  favicon: assets/favicon.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.footer
    # Scroll position reflected in the URL hash for shareable links.
    # navigation.instant is deliberately NOT enabled: the i18n contextual
    # language switcher is incompatible with it (stale header links after
    # client-side page swaps).
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

# FastAPI-style template tweaks (link color on white header, active tab
# underline, centered page title)
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Sidebar outline stops at API root headings (h3); member methods
      # and attributes (h4) stay out of the "On this page" nav.
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      # Every highlighted block restarts its anchor counter at zero. With
      # multiple mkdocstrings source blocks this duplicates IDs and makes
      # later gutter links jump to earlier blocks; keep visual line numbers
      # but disable the broken per-line anchors.
      anchor_linenums: false
  - pymdownx.inlinehilite
  # Icon shortcodes for the landing-page feature cards (:material-*:).
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search:
      lang:
        - en
        - zh
  # i18n must come after search and before mkdocstrings; Material renders
  # the language selector in the header automatically from this config.
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Learn: 学习
            Quickstart: 快速开始
            Configuration: 配置
            CLI & Commands: 命令行与斜杠命令
            Migrating to 1.0: 迁移到 1.0
            Guides: 专题指南
            Embedding the SDK: 嵌入式 SDK
            Tools, Skills & Experts: 工具、技能与专家
            Subagents, Hooks & Memory: 子代理、Hooks 与记忆
            Security, Platform & MCP: 安全、平台与 MCP
            Reference: 参考
            SDK & Config: SDK 与配置
            Agent, Runtime & Events: Agent、运行时与事件
            Providers: 模型提供者
            Tools & Skills: 工具与技能
            Memory & Sessions: 记忆与会话
            Platforms, MCP & Server: 平台、MCP 与本地服务
            Governance & Engine: 治理与执行引擎
            Eval: 评测
            Resources: 资源
            Developer Guide: 开发者指南
            Examples (GitHub): 示例（GitHub）
            Help & Issues: 帮助与问题反馈
            About: 关于
            Release Notes: 发行说明
  # Resolve cross-references to the same-language page when an identifier
  # exists in both locales (en at the root, zh under zh/).
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            # Roots render as h3 under each page's h2 sections so the
            # toc_depth above groups them per section instead of mixing
            # them with section titles.
            heading_level: 3
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            # Kind badges (class/function/method) in headings and TOC.
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            # Constructor parameters are public API contract: render them
            # on the class itself. merge_init_into_class only sees members
            # that survive the filters, so re-include __init__ explicitly.
            merge_init_into_class: true
            # Undocumented members are still contract: dataclass fields
            # (Config) and event payload helpers carry no docstrings but
            # must show their names, types and defaults in the Reference.
            show_if_no_docstring: true
            filters:
              - "!^_"
              # Last matching filter wins: keep __init__ for the merge above.
              - "^__init__$"

nav:
  - AgenticX: index.md
  - Learn:
      - Quickstart: quickstart.md
      - Configuration: configuration.md
      - CLI & Commands: cli.md
      - Migrating to 1.0: migration.md
      - Guides:
          - Embedding the SDK: guides/sdk.md
          - Tools, Skills & Experts: guides/tools-and-skills.md
          - Subagents, Hooks & Memory: guides/agent-patterns.md
          - Security, Platform & MCP: guides/security-and-platform.md
  - Reference:
      - SDK & Config: reference/sdk.md
      - Agent, Runtime & Events: reference/agent.md
      - Providers: reference/providers.md
      - Tools & Skills: reference/tools.md
      - Memory & Sessions: reference/memory.md
      - Platforms, MCP & Server: reference/platforms.md
      - Governance & Engine: reference/governance.md
      - Eval: reference/eval.md
  - Resources:
      - Developer Guide: develop.md
      - Examples (GitHub): https://github.com/dashscope/dashscope-agenticx/tree/main/tests/e2e
      - Help & Issues: https://github.com/dashscope/dashscope-agenticx/issues
  - About: about.md
  - Release Notes: release-notes.md

# Maintenance notes are repo-only, not part of the site (README.md would
# conflict with index.md)
exclude_docs: |
  README.md
  README_zh.md
  overrides/*
  hooks.py

hooks:
  - docs/hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dashscope/dashscope-agenticx
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dashscope-agenticx/
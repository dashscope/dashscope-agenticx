[build-system]
requires = ["setuptools>=84.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dashscope-agenticx"
dynamic = ["version"]
description = "DashScope AgenticX - a secure, embeddable runtime for agentic apps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "prompt-toolkit>=3.0",
    "rich>=13.0",
    "httpx>=0.27",
    "certifi>=2026.10.18",
    "PyYAML>=6.0",
    "keyring>=25.0",
    "packaging>=23.0",
    "platformdirs>=4.0",
    # tomllib is stdlib in Python 3.11+; backport for 3.10
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tui = ["textual>=0.50,<9"]
provider-openai = ["openai>=1.30,<4"]
provider-anthropic = ["anthropic>=0.40,<2"]
web = ["ddgs>=1.0"]
browser = ["playwright>=1.40"]
voice = ["dashscope>=1.20", "sounddevice>=0.4", "numpy>=1.20", "aiohttp>=3.14.4", "multidict>=6.9.1", "urllib3>=2.8.0"]
camera = ["opencv-python-headless>=4.5"]
vision = ["pillow>=13.0.0"]
media = ["dashscope>=1.20", "sounddevice>=0.4", "numpy>=1.20", "opencv-python-headless>=4.5", "pillow>=13.0.0", "aiohttp>=3.14.4", "multidict>=6.9.1", "urllib3>=2.8.0"]
mcp-server = []
scheduler = []
experimental = []
all = ["textual>=0.50,<9", "openai>=1.30,<4", "anthropic>=0.40,<2", "ddgs>=1.0", "playwright>=1.40", "dashscope>=1.20", "sounddevice>=0.4", "numpy>=1.20", "opencv-python-headless>=4.5", "pillow>=13.0.0; python_version >= '3.11'", "aiohttp>=3.14.4", "multidict>=6.9.1", "urllib3>=2.8.0"]
build = ["pyinstaller>=6.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "black>=24.0", "isort>=5.13"]

[project.scripts]
agenticx = "dashscope_agenticx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "dashscope_agenticx._version.__version__"}

[tool.setuptools.package-data]
dashscope_agenticx = [
    "py.typed",
    "bundled_apps/*/app.toml",
    "bundled_apps/*/.agenticx/*.md",
    "bundled_apps/*/eval.json",
    "bundled_apps/*/acceptance.toml",
]

[tool.black]
line-length = 79
target-version = ['py310', 'py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 79
skip_gitignore = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests that exercise agenticx with a fake LLM provider",
]

[tool.coverage.run]
source = ["src/dashscope_agenticx"]
omit = [
    "src/dashscope_agenticx/__main__.py",
    "src/dashscope_agenticx/ui/*",
    "src/dashscope_agenticx/tools/browser.py",
    "src/dashscope_agenticx/tools/camera.py",
    "src/dashscope_agenticx/tools/evolution.py",
    "src/dashscope_agenticx/scheduler.py",
    "src/dashscope_agenticx/mcp_server.py",
    "src/dashscope_agenticx/mcp_stdio.py",
    "src/dashscope_agenticx/dev.py",
    "src/dashscope_agenticx/cli/handlers_device.py",
    "src/dashscope_agenticx/cli/handlers_setup.py",
]

# fail_under is a ratchet: raise it as coverage grows, never lower it.
[tool.coverage.report]
fail_under = 80
show_missing = false
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]
